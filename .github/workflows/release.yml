name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create draft release from version on `main`
        type: boolean
        default: false

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      force_publish: ${{ inputs.force_publish == true }}

  build:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BUILD_ARTIFACT_PATH: build/flipbook-batteries.zip
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Build flipbook-batteries
        run: lute run build

      - uses: actions/upload-artifact@v4
        with:
          path: ${{ env.BUILD_ARTIFACT_PATH }}
          name: flipbook-batteries

      - name: Attach archive to draft release
        if: needs.release.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.release.outputs.tag }}"

          is_draft="$(gh release view "$tag" --json isDraft -q '.isDraft' || echo false)"
          if [ "$is_draft" != "true" ]; then
            echo "No draft release for $tag, skipping asset upload"
            exit 0
          fi

          gh release upload "$tag" "${BUILD_ARTIFACT_PATH}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
