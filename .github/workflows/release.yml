name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create a release from the configured version on main
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Build
        run: lute run build

      - id: changewrite
        uses: flipbook-labs/changewrite@v0.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-publish: ${{ inputs.force_publish || false }}
          base: main
          branch: publish-next-version
          post-draft-hook: |
            "$CHANGEWRITE_BIN" attach --tag "$CHANGEWRITE_TAG" --files build/flipbook-batteries.zip
          pr-title: Publish v{{version}}
          pr-body: |
            >[!IMPORTANT]
            > This PR prepares the next release by bumping the version and updating the changelog.
            >
            > **Merging this PR will:**
            >
            > 1. Create and push tag `{{tag}}`
            > 2. Create a GitHub release for that tag
            > 3. Attach the standalone `flipbook-batteries.zip` build to the release

            <details>
            <summary><b>GitHub Release preview</b></summary>

            # {{tag}}

            {{notes}}
            </details>

            Next release will be available here:
            {{repo_url}}/releases/tag/{{tag}}

            This PR was generated by [this run]({{run_url}}).
