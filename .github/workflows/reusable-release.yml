# Reusable release-management pipeline for Luau/Lute projects.
#
# Handles the parts that are identical across repos: deciding whether to
# publish, tagging + drafting the GitHub release with git-cliff notes, and
# preparing the next version-bump PR. It deliberately does NOT build anything —
# builds differ per project (library zip vs multi-OS binaries), so the calling
# workflow owns its own build job and hangs it off this workflow's outputs.
#
# Requirements in the calling repo:
#   - A `loom.config.luau` with a `version = "x.y.z"` line (source of truth).
#   - A `cliff.toml` (git-cliff config) for changelog/release-note generation.
#   - Call with `secrets: inherit` so the GitHub App credentials are available.

name: Reusable release

on:
  workflow_call:
    inputs:
      force_publish:
        description: Tag and create draft release from the version on the default branch
        type: boolean
        default: false
      bump:
        description: Which semver component to bump when preparing the next release (minor | patch)
        type: string
        default: minor
    secrets:
      FLIPBOOK_BACKEND_APP_ID:
        description: GitHub App ID used to author the publish PR so it triggers CI
        required: false
      FLIPBOOK_BACKEND_APP_PRIVATE_KEY:
        description: Private key for the GitHub App
        required: false
    outputs:
      version:
        description: The version currently in loom.config.luau
        value: ${{ jobs.gate.outputs.version }}
      tag:
        description: The tag for the current version (v-prefixed)
        value: v${{ jobs.gate.outputs.version }}
      should_publish:
        description: Whether this run published (tagged + drafted) the current version
        value: ${{ jobs.gate.outputs.should_publish }}
      has_changes:
        description: Whether there are unreleased commits since the latest tag
        value: ${{ jobs.gate.outputs.has_changes }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.eval.outputs.has_changes }}
      should_publish: ${{ steps.eval.outputs.should_publish }}
      version: ${{ steps.eval.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Evaluate release action
        id: eval
        run: |
          set -euo pipefail

          version="$(grep -m1 'version = "' loom.config.luau | sed 's/.*version = "\([^"]*\)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not read package version from loom.config.luau" >&2
            exit 1
          fi

          if [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The version in loom.config.luau is the source of truth. If it
          # has no matching tag yet, a publish PR was just merged (the bump
          # landed but nothing has been released) so we publish it. This is
          # state-based and does not depend on the merge commit's message.
          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The current version is already released. Surface whether there
          # are commits since its tag so a new publish PR can be prepared.
          commit_count="$(git rev-list --count "v${version}..HEAD")"
          if [ "$commit_count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Locate publish commit
        id: commit
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"

          # The publish commit is the one that set this version in
          # loom.config.luau, so pickaxe for that exact line rather than tagging
          # whichever commit happened to trip the gate. The gate only ever
          # publishes the current (latest) version, whose line hasn't been
          # changed away yet, so the newest match is the commit that set it.
          sha="$(git log -1 --format=%H -S"version = \"${version}\"" -- loom.config.luau)"
          if [ -z "$sha" ]; then
            echo "Could not find the commit that set version ${version}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create and push publish tag
        run: |
          set -euo pipefail
          tag="v${{ needs.gate.outputs.version }}"

          if git ls-remote --exit-code origin "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists on origin"
            exit 0
          fi

          git tag "${tag}" "${{ steps.commit.outputs.sha }}"
          git push origin "${tag}"

      # Generate notes for just this release. `--latest` restricts git-cliff to
      # the newest tag (the one we just pushed) and `--strip header` drops the
      # changelog preamble, so the output is only the current release's section.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create draft GitHub release
        run: |
          set -euo pipefail
          tag="v${{ needs.gate.outputs.version }}"
          if gh release view "$tag"; then
            echo "Draft release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --target "${{ steps.commit.outputs.sha }}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare-release-pr:
    needs: [gate, publish-release]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (
        (needs.gate.outputs.has_changes == 'true' && needs.gate.outputs.should_publish != 'true') ||
        (needs.gate.outputs.should_publish == 'true' && needs.publish-release.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Author the PR as the GitHub App rather than the default GITHUB_TOKEN so
      # that the resulting branch push triggers CI on the publish PR (pushes
      # made with GITHUB_TOKEN do not trigger further workflow runs).
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FLIPBOOK_BACKEND_APP_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            case "${{ inputs.bump }}" in
              patch) next_version="$major.$minor.$((patch + 1))" ;;
              *)     next_version="$major.$((minor + 1)).0" ;;
            esac
          else
            next_version="$version"
          fi
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Bump package version
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next_version }}"
          # Replace only the first `version = "..."` line (the package version);
          # dependencies in loom.config.luau use `rev`, not `version`.
          sed -i '0,/version = "[^"]*"/s//version = "'"$next"'"/' loom.config.luau
          grep -q "version = \"$next\"" loom.config.luau || {
            echo "Failed to bump version to $next" >&2
            exit 1
          }

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.next_version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create or update publish PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.ref_name }}
          branch: publish-next-version
          title: "[AUTO-GENERATED] Publish v${{ steps.version.outputs.next_version }}"
          commit-message: "Publish v${{ steps.version.outputs.next_version }}"
          body: |
            This PR prepares the next release by bumping the version and updating the changelog.

            Merging this PR will:

            1. Create and push tag `v${{ steps.version.outputs.next_version }}`
            2. Create a draft GitHub release for that tag
            3. Build the project and attach release assets to the draft release

            Next release will be available here:
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.next_version }}

            🤖 This PR was generated by [this action run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          add-paths: |
            CHANGELOG.md
            loom.config.luau
